<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>
    </head>
    <body>
        <div class="container">
            <h1>Get In Touch</h1>
            <p>We d love to hear from you. Send usa message and well respond as soon as possible</p>
            <form>
                <label  for="fullname" name="fullname">Full Name</label>
                <br>
                <br>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe">
                <br>
                <br>

                <label for="email" name="mail">Email Address</label>
                <br>
                <br>
                <input type="email" id="email" name="mail" placeholder="john@example.com">
                <br>
                <br>

                <label for="password" name="password">Password</label>
                <br>
                <br>
                <input type="password" id="password" name="password" placeholder="Password">
                <br>
                <br>
                <label for="submit" name="submit"></label>
                <input type="submit" id="submit" name="submit" value="Submit">
                <label for="reset" name="reset"></label>
                <input type="submit" id="reset" name="reset" value="Reset">
            </form>

        </div>
    </body>
</html>
