<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>
    </head>
    <body>
        <div class="container">
            <h1>Forget Password</h1>
            <p>Enter your email address to reset your password</p>
            <form>

                <label for="email" name="mail">Email Address</label>
                <br>
                <br>
                <input type="email" id="email" name="mail" placeholder="john@example.com">
                <br>
                <br>

                <label for="repassword" name="repassword">Password</label>
                <br>
                <br>
                <input type="password" id="repassword" name="repassword" placeholder="Password">
                <br>
                <br>
                <label for="reset" name="reset">Reset Password</label>
                <br>
                <br>
                <input type="submit" id="reset" name="reset" value="Reset Password">

            </form>

        </div>
    </body>
</html>
